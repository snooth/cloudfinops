# =============================================================================
# firmgate.io — Cloud FinOps portal at /finops
# Mirror of https://iamfinops.com.au for corporate networks that block that host.
# =============================================================================
#
# Prerequisites on the same VPS (or any host serving firmgate.io):
#   1. Cloud FinOps Node app listening on 127.0.0.1:4001 with BASE_PATH=/finops
#   2. Client built with:  npm run build:firmgate
#   3. Include this snippet in the firmgate.io HTTPS server{} block, then:
#        sudo nginx -t && sudo systemctl reload nginx
#
# Keep https://iamfinops.com.au as a separate server_name → port 4000 (root, no BASE_PATH).
# =============================================================================

# Optional dedicated upstream (recommend using a second FinOps process on :4001)
upstream cloud_finops_firmgate {
    server 127.0.0.1:4001;
    keepalive 8;
}

# Inside: server { server_name firmgate.io; ... }

# Canonical: always trailing slash
location = /finops {
    return 301 /finops/;
}

# Portal UI + API: https://firmgate.io/finops/  and  /finops/api/*
location /finops/ {
    proxy_pass http://cloud_finops_firmgate;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Import large system ZIPs from Software Version page
    client_max_body_size 150m;

    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
}
